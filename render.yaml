# Deployment source of truth. Apply this Blueprint once the private repository is connected.
services:
  - type: web
    name: hamilton-wall-systems-clock
    runtime: docker
    repo: https://github.com/kisert0428-cmd/hamilton-timeclock
    branch: main
    region: virginia
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: npm run migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hamilton-wall-systems-payroll
          property: connectionString
# APP_ORIGIN automatically uses Render's documented RENDER_EXTERNAL_URL.
# Set APP_ORIGIN explicitly if adding a custom domain.
databases:
  - name: hamilton-wall-systems-payroll
    databaseName: hamilton_payroll
    user: hamilton_clock
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
